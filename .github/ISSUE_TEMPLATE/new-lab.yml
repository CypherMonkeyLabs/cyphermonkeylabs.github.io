name: New lab
description: Propose a lab for the manifest
title: "[Lab] "
body:
  - type: input
    id: id
    attributes:
      label: Lab id
      description: Lowercase words separated by hyphens.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Lab URL
      description: https://cyphermonkeylabs.com/<repo>/
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository
      description: https://github.com/CypherMonkeyLabs/<repo>
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Official docs, RFCs, or standards. No vendor logos.
    validations:
      required: true
