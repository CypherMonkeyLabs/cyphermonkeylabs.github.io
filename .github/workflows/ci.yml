name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: trust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test .github/scripts/trust.test.mjs
      - name: Validate labs manifest and lab URLs
        run: node .github/scripts/validate-labs.mjs --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check trust-page links
        run: node .github/scripts/check-links.mjs
      - name: No public email address
        run: node .github/scripts/check-no-email.mjs
      - name: Performance budgets
        run: node .github/scripts/check-budgets.mjs
