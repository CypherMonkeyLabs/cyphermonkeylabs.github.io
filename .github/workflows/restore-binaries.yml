name: Restore binary assets
on:
  push:
    branches: [main]
    paths:
      - '_b64/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode
        run: |
          set -e
          test -d _b64
          find _b64 -type f -name '*.b64' | while read -r f; do
            out="${f#_b64/}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            echo "restored $out $(stat -c %s "$out")"
          done
          rm -rf _b64
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore binary assets [skip ci]"
          git push origin HEAD:main
